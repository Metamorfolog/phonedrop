plugins {
    id 'com.android.application'
}

// Podpisový klíč pro vydání: cesta a hesla v android/keystore.properties (není v gitu, klíč leží mimo repo).
// Bez něj se release podepíše ladicím klíčem – takové APK nejde vydávat, aktualizace by se nenainstalovaly.
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }

android {
    namespace 'cz.metamorfolog.phonedrop'
    compileSdk 36

    defaultConfig {
        applicationId 'cz.metamorfolog.phonedrop'
        // MediaStore.Downloads + RELATIVE_PATH (Download/Drop) bez oprávnění k úložišti.
        minSdk 29
        targetSdk 36
        // Vydání (GitHub Actions) bere verzi ze značky: -PverName=X.Y.Z -PverCode=X*10000+Y*100+Z
        versionCode Integer.parseInt((project.findProperty('verCode') ?: '10300').toString())
        versionName((project.findProperty('verName') ?: '1.3.0').toString())
        // Odkud se berou aktualizace (poslední vydání na GitHubu); pro testy -PupdateUrl=…
        buildConfigField 'String', 'UPDATE_URL',
                "\"${project.findProperty('updateUrl') ?: 'https://api.github.com/repos/Metamorfolog/phonedrop/releases/latest'}\""
        // Zpětná vazba (služba na webu projektu); pro testy -PfeedbackUrl=…
        buildConfigField 'String', 'FEEDBACK_URL',
                "\"${project.findProperty('feedbackUrl') ?: 'https://phonedrop.apexpiksel.cz/api/feedback'}\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile file(keystoreProps.getProperty('storeFile'))
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                logger.warn('keystore.properties chybí – release se podepíše ladicím klíčem (jen pro testy).')
                signingConfig signingConfigs.debug
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
