# Sestavení a kontrola při každém pushi do main a u pull requestů.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Sestavit
        run: dotnet build windows/PhoneDrop -c Release
      - name: Self-contained exe (ořezané, jako ve vydání)
        run: dotnet publish windows/PhoneDrop -c Release -r win-x64 -p:SelfContained=true -p:PublishSingleFile=true -o out/full
      - name: Malé exe (vyžaduje .NET)
        run: dotnet publish windows/PhoneDrop -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o out/small
      - name: Okna se vykreslí (self-contained)
        shell: pwsh
        run: |
          $p = Start-Process out/full/PhoneDrop.exe -ArgumentList '--ui-selftest', "$PWD/shots" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "ui-selftest skončil kódem $($p.ExitCode)" }
          Get-ChildItem shots
      - uses: actions/upload-artifact@v7
        with:
          name: ui-screenshots
          path: shots/

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Sestavit PhoneDrop.app a DMG
        run: mac/build.sh
      - name: Appka se spustí
        run: |
          lipo mac/dist/PhoneDrop.app/Contents/MacOS/PhoneDrop -verify_arch arm64 x86_64
          open mac/dist/PhoneDrop.app; sleep 5
          pgrep -x PhoneDrop || { echo "::error::PhoneDrop se nespustil"; exit 1; }
          pkill -x PhoneDrop
      - uses: actions/upload-artifact@v7
        with:
          name: mac-dmg
          path: mac/dist/PhoneDrop-*-mac.dmg

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Sestavit a lint
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug lintDebug
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-debug.html
