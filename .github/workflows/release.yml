# Vydání: push značky vX.Y.Z → sestaví exe, Mac DMG i APK z veřejného kódu, podepíše APK klíčem z tajemství
# repozitáře a založí GitHub Release se SHA256SUMS.txt (podle nich ověřují aktualizace obě appky).
#
# Tajemství (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   keystore v base64
#   ANDROID_KEYSTORE_PASSWORD heslo keystoru
#   ANDROID_KEY_ALIAS         alias klíče
#   ANDROID_KEY_PASSWORD      heslo klíče
# Poznámky k vydání: .github/release-notes/vX.Y.Z.md (když chybí, vygenerují se z commitů).
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - id: v
        run: |
          name="${GITHUB_REF_NAME#v}"
          [[ "$name" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "::error::Značka musí být vX.Y.Z"; exit 1; }
          code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Verze $name (versionCode $code)"

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VER: ${{ needs.version.outputs.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Self-contained exe
        run: dotnet publish windows/PhoneDrop -c Release -r win-x64 -p:SelfContained=true -p:PublishSingleFile=true -p:Version=${{ env.VER }} -o out/full
      - name: Malé exe
        run: dotnet publish windows/PhoneDrop -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:Version=${{ env.VER }} -o out/small
      - name: Kontrola a přejmenování
        shell: pwsh
        run: |
          $p = Start-Process out/full/PhoneDrop.exe -ArgumentList '--ui-selftest', "$PWD/shots" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "ui-selftest skončil kódem $($p.ExitCode)" }
          $v = (Get-Item out/full/PhoneDrop.exe).VersionInfo.ProductVersion
          if (-not $v.StartsWith($env:VER)) { throw "exe má verzi $v, čekal jsem $env:VER" }
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item out/full/PhoneDrop.exe "dist/PhoneDrop-$env:VER-win-x64.exe"
          Copy-Item out/small/PhoneDrop.exe "dist/PhoneDrop-$env:VER-win-x64-small.exe"
          Get-ChildItem dist
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/

  mac:
    needs: version
    runs-on: macos-latest
    env:
      VER: ${{ needs.version.outputs.name }}
    steps:
      - uses: actions/checkout@v7
      - name: PhoneDrop.app, DMG a ZIP (universal, ad-hoc podpis)
        run: mac/build.sh "$VER"
      - name: Kontrola
        run: |
          app=mac/dist/PhoneDrop.app
          v=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist")
          [ "$v" = "$VER" ] || { echo "::error::appka má verzi $v, čekal jsem $VER"; exit 1; }
          lipo "$app/Contents/MacOS/PhoneDrop" -verify_arch arm64 x86_64
          open "$app"; sleep 5
          pgrep -x PhoneDrop || { echo "::error::PhoneDrop se nespustil"; exit 1; }
          pkill -x PhoneDrop
          mkdir dist && cp mac/dist/PhoneDrop-*-mac.dmg mac/dist/PhoneDrop-*-mac.zip dist/
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: mac
          path: dist/

  android:
    needs: version
    runs-on: ubuntu-latest
    env:
      VER: ${{ needs.version.outputs.name }}
      CODE: ${{ needs.version.outputs.code }}
      # Otisk certifikátu PhoneDrop – APK podepsané jiným klíčem by se přes starou verzi nenainstalovalo.
      CERT_SHA256: e410e1618f7c968d4194bfbca53a37f68e764b284ca7c1cc4a2e2face4fe9b43
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Podpisový klíč
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::Chybí tajemství ANDROID_KEYSTORE_BASE64"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/keystore.properties
      - name: Sestavit APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease -PverName=$VER -PverCode=$CODE
      - name: Ověřit podpis
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          signer=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$signer" verify --print-certs "$apk" | tee certs.txt
          grep -qi "SHA-256 digest: $CERT_SHA256" certs.txt || { echo "::error::APK není podepsané klíčem PhoneDrop"; exit 1; }
          mkdir dist && cp "$apk" "dist/PhoneDrop-$VER.apk"
      - name: Uklidit klíč
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" android/keystore.properties
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/

  release:
    needs: [version, windows, mac, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Kontrolní součty
        working-directory: dist
        run: |
          sha256sum -b PhoneDrop-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Vydání na GitHubu
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: PhoneDrop ${{ needs.version.outputs.name }}
        run: |
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then args=(--notes-file "$notes"); else args=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" dist/* --title "$TITLE" --verify-tag "${args[@]}"
